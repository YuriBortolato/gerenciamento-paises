services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: countries_app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: countries_db
    environment:
      POSTGRES_DB: countries_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - countries_pgdata:/var/lib/postgresql/data

volumes:
  countries_pgdata: